[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

sourceSets {
  smokeTest {
    java.srcDir 'src/smokeTest/java'
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
  }
}

tasks.register('networkSmokeTest', JavaExec) {
  group = 'verification'
  description = 'Runs the standalone two-client LAN networking smoke test.'
  dependsOn smokeTestClasses
  classpath = sourceSets.smokeTest.runtimeClasspath
  mainClass = 'com.conquertheworld.game.networking.testing.NetworkSmokeTest'
  workingDir rootProject.projectDir
  systemProperty 'game.data.dir', file("${rootProject.projectDir}/assets/data").absolutePath
}

tasks.named('test') {
  useJUnitPlatform()
  workingDir rootProject.projectDir
  systemProperty 'game.data.dir', file("${rootProject.projectDir}/assets/data").absolutePath
}

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.MrStahlfelge.gdx-websockets:core:$websocketVersion"
  api "de.golfgl.gdxcontrollerutils:gdx-controllerutils-mapping:$controllerMappingVersion"

  testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
